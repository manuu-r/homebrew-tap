[package]
name = "gauge"
version = "0.1.4"
edition = "2021"
description = "Minimal Rust CLI for showing agent quota (Codex + Claude)."
license = "MIT"

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30.13"
tray-icon = "0.24.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAlert", "NSApplication", "NSButton", "NSColor", "NSControl", "NSFont", "NSFontDescriptor", "NSMenu", "NSPopover", "NSResponder", "NSStatusItem", "NSText", "NSTextField", "NSView", "NSViewController", "objc2-core-foundation"] }
objc2-event-kit = { version = "0.3", default-features = false, features = ["EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKReminder", "EKTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSDate", "NSError", "NSGeometry", "NSPredicate", "NSString"] }
