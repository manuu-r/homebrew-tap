[package]
name = "gauge"
version = "0.1.4"
edition = "2021"
description = "Minimal Rust CLI for showing agent quota (Codex + Claude)."
license = "MIT"

[dependencies]
btleplug = "0.12"
chrono = "0.4"
getrandom = "0.3"
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = "1"
winit = "0.30.13"
tray-icon = "0.24.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAlert", "NSApplication", "NSButton", "NSColor", "NSControl", "NSFont", "NSFontDescriptor", "NSMenu", "NSPopover", "NSResponder", "NSSecureTextField", "NSStatusItem", "NSText", "NSTextField", "NSView", "NSViewController", "objc2-core-foundation"] }
objc2-core-location = { version = "0.3", default-features = false, features = ["CLLocationManager"] }
objc2-event-kit = { version = "0.3", default-features = false, features = ["block2", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKReminder", "EKTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSDate", "NSError", "NSGeometry", "NSPredicate", "NSString"] }
security-framework = "3.7"
security-framework-sys = "2.17"
