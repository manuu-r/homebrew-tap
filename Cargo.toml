[package]
name = "gauge"
version = "0.1.2"
edition = "2021"
description = "Minimal Rust CLI for showing agent quota (Codex + Claude)."
license = "MIT"

[dependencies]
chrono = "0.4"
serde_json = "1"
winit = "0.30.13"
tray-icon = "0.24.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["objc2-core-foundation", "NSFont", "NSFontDescriptor", "NSMenu"] }
