[platformio]
default_envs = display

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The board default (460800) fails this USB-serial bridge at "Uploading stub"
; with "Unable to verify flash chip connection". 115200 is reliable; raise it
; if your adapter can take it.
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit BusIO@^1.16.2

; HTTP over Wi-Fi, rendered on an ST7789 240x320 panel.
; Discovers the gauge server via its unauthenticated /health route, then polls
; GET /v1/quota once a minute with the API token.
[env:display]
build_flags = -Wall -Wextra -Wno-unused-parameter
build_src_filter = +<*> -<display_test.cpp>

; Panel bring-up diagnostic. Walks software SPI, then hardware SPI across
; modes and speeds, narrating each stage on serial. See src/display_test.cpp.
[env:displaytest]
build_flags = -Wall -Wextra -Wno-unused-parameter
build_src_filter = +<display_test.cpp> +<ui.cpp> +<emoji.cpp>

; The UDP ("BLE-style") transport that `gauge --ble` serves on port 8081 is not
; implemented by this client. Follow the protocol docs in README.md and the
; repo root README if you want to add a UDP environment alongside this one.
