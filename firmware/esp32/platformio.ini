[platformio]
default_envs = display

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The board default (460800) fails this USB-serial bridge at "Uploading stub".
upload_speed = 115200
; Bluetooth, Wi-Fi, mDNS and HTTP together exceed the default 1.3 MB app slot.
board_build.partitions = huge_app.csv
build_flags = -Wall -Wextra -Wno-unused-parameter
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit BusIO@^1.16.2
    madhephaestus/ESP32Servo@^3.0.5

; Gauge accessory: BLE pairing, Bonjour discovery, authenticated dashboard.
[env:display]
build_src_filter = +<*> -<display_test.cpp>

; Panel bring-up diagnostic. See src/display_test.cpp.
[env:displaytest]
build_src_filter = +<display_test.cpp> +<ui.cpp> +<emoji.cpp>
