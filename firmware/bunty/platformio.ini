[platformio]
default_envs = bunty

[env:bunty]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
board_build.partitions = default_8MB.csv
; The N8R8 module carries 8 MB of octal-interface PSRAM. Voice needs it: the
; capture and playback rings plus the TLS session do not fit alongside the
; display framebuffer in internal SRAM.
board_build.arduino.memory_type = qio_opi
extra_scripts = pre:scripts/provision_iot_gateway.py
build_unflags =
    -fexceptions
build_flags =
    ; Bunty's USB connector reaches UART0 through a CH343 bridge. Keeping
    ; Serial on UART0 makes application diagnostics appear beside ESP-IDF
    ; Wi-Fi logs in `pio device monitor`; native USB CDC is not wired here.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D FLOW32_ENABLE_ST7735=0
    -D BOARD_HAS_PSRAM
    ; Temporary: lets esp-tls and the websocket client report why a
    ; handshake failed. Drop back to 0 once voice is known good.
    -D CORE_DEBUG_LEVEL=3
    -fno-exceptions
    -Wall
    -Wextra
    -Wno-unused-parameter
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit BusIO@^1.16.2
